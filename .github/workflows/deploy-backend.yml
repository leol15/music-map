name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "nginx/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write .env to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cat > ~/prod/music-map/backend/.env << 'EOF'
            PORT=${{ secrets.PORT }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            GOOGLE_MODEL=${{ secrets.GOOGLE_MODEL }}
            SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
            SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
            SPOTIFY_REFRESH_TOKEN=${{ secrets.SPOTIFY_REFRESH_TOKEN }}
            YOUTUBE_CLIENT_ID=${{ secrets.YOUTUBE_CLIENT_ID }}
            YOUTUBE_CLIENT_SECRET=${{ secrets.YOUTUBE_CLIENT_SECRET }}
            YOUTUBE_REFRESH_TOKEN=${{ secrets.YOUTUBE_REFRESH_TOKEN }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
            LLM_PROVIDER=${{ secrets.LLM_PROVIDER }}
            MUSIC_PROVIDER=${{ secrets.MUSIC_PROVIDER }}
            RECOMMENDATION_COUNT=${{ secrets.RECOMMENDATION_COUNT }}
            MOCK_RECOMMENDATIONS=${{ secrets.MOCK_RECOMMENDATIONS }}
            EOF

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            APP_DIR=~/prod/music-map
            cd "$APP_DIR"
            git pull origin main
            cd backend
            npm ci --omit=dev
            sudo cp "$APP_DIR/nginx/music-map.conf" /etc/nginx/default.d/music-map.conf
            sudo nginx -t && sudo systemctl reload nginx
            pm2 restart music-map-backend || pm2 start src/index.js --name music-map-backend
            pm2 save
