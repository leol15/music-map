# Music Map — Nginx location block snippet
# Deploy: sudo cp nginx/music-map.conf /etc/nginx/default.d/music-map.conf
#         sudo nginx -t && sudo systemctl reload nginx
# NOTE: must go in default.d/ (included inside server block), not conf.d/ (http level)

location /api/music-map/ {
    proxy_pass         http://localhost:3001/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}
